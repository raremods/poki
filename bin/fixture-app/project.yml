name: PokiMCPFixture
options:
  bundleIdPrefix: local.pokimcp
  deploymentTarget:
    iOS: '17.0'
targets:
  PokiMCPFixture:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pokimcp.fixture
        PRODUCT_NAME: PokiMCPFixture
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Qeno MCP Test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
schemes:
  PokiMCPFixture:
    build:
      targets:
        PokiMCPFixture: all
