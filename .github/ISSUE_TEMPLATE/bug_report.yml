name: Bug report (Poki MCP or Poki Agent on a computer)
description: Poki MCP, Poki Agent, or a messaging channel does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove passcodes, tokens, pairing records, and private screen contents. To report a vulnerability, use [private reporting](https://github.com/JosssphZhou/poki/security/advisories/new).
        Search [existing issues](https://github.com/JosssphZhou/poki/issues?q=is%3Aissue) first. Agents filing for a user: read [AGENTS.md](https://github.com/JosssphZhou/poki/blob/main/AGENTS.md#file-an-issue).
        For the Poki iPhone app or Poki Setup, use the **iPhone app bug** form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The task or tool call, and the response you got. Say if you reproduced it more than once.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Poki MCP
        - Poki Agent
        - iMessage or Telegram channel
        - Setup or update (bin/setup, poki update)
        - Native helper (poki-native)
        - Relay or remote MCP (deploy/)
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Physical iPhone over USB
        - Physical iPhone over LAN (RemotePairing)
        - Physical iPhone over Tailscale or VPN
        - iOS Simulator
        - Not device-related
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Poki version and commit (from poki_mcp_status), macOS or Linux, Xcode, iPhone model, and iOS.
      placeholder: 0.1.1 f4fd51e, macOS 27.2, Xcode 27.2, iPhone 17 Pro, iOS 27.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The daemon log lines or error output around the failure. Remove tokens and private text.
      render: text
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause or fix
      description: Optional. File and line, or what you already tried.
