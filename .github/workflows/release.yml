# A release: push a tag ios-vX.Y.Z. Builds Poki and Poki Runner
# from that commit with the same version (from the tag) and build number (this run's number), and
# attaches Poki-X.Y.Z-N.ipa, PokiRunner-X.Y.Z-N.ipa and SHA256SUMS to a GitHub Release. Both IPAs are
# unsigned; people sign them with their own signing tool and Apple ID when they install.
name: Release

on:
  # Tag-only: runs when a tag like ios-v0.2.0 is pushed, never on branch pushes.
  push:
    tags: ['ios-v*.*.*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        run: |
          VERSION="${GITHUB_REF_NAME#ios-v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tags look like ios-v1.2.3"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  app:
    needs: version
    uses: ./.github/workflows/ios-app.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}

  runner:
    needs: version
    uses: ./.github/workflows/ios-runner.yml
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ needs.version.outputs.build }}

  publish:
    needs: [version, app, runner]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Poki-unsigned, path: app }
      - uses: actions/download-artifact@v4
        with: { name: poki-runner-unsigned, path: runner }
      - name: Attach to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          set -euo pipefail
          mkdir release
          cp app/Poki-unsigned.ipa "release/Poki-$VERSION-$BUILD.ipa"
          cp app/Poki-external-unsigned.ipa "release/Poki-external-$VERSION-$BUILD.ipa"
          cp app/Qeno-signing.zip release/
          # Only the runner without Xcode's frameworks: the one the launcher is tested with.
          cp runner/poki-runner-unsigned.ipa "release/PokiRunner-$VERSION-$BUILD.ipa"
          # The relay Worker from this commit, so Poki Setup deploys the relay that matches this release.
          cp deploy/cf-relay/worker.js release/poki-relay-worker.js
          (cd release && sha256sum *.ipa poki-relay-worker.js > SHA256SUMS && cat SHA256SUMS)
          notes="Poki $VERSION ($BUILD). Choose Poki for the built-in local VPN (Network Extensions signing required), or Poki-external for an external VPN such as LocalDevVPN. Install your chosen app; Poki automates the iPhone itself. PokiRunner is only for the older Runner path (launch Poki with -automationPath runner); install it with the same signing tool and Apple ID as Poki. Entitlements are in Qeno-signing.zip. See native/ios-app/README.md."
          notes="$notes Relay: Poki Setup's Update Relay deploys this release's relay Worker; to update it yourself, replace your poki-relay Worker's code in the Cloudflare dashboard with https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/poki-relay-worker.js (SHA-256 in SHA256SUMS)."
          gh release create "$GITHUB_REF_NAME" release/* --title "Poki $VERSION" --notes "$notes" --prerelease
